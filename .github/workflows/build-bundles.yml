name: Build portable bundles

on:
  push:
    branches: [dev]
    paths:
      - app.py
      - static/**
      - vendor/**
      - start.bat
      - start.command
      - README.md
      - .github/build_release.py

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows-x64
          - os: macos-15
            slug: macos-arm64
          - os: macos-15-intel
            slug: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pyinstaller>=6.16,<7' -r requirements.txt
      - run: python .github/build_release.py --slug ${{ matrix.slug }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
